<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Judge: fan-out larger than fan-in and iteration cycle with a binary gate</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9C5C0"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5A3F5"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="808" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>
  <text x="52" y="52" font-size="20" font-weight="bold" letter-spacing="1" fill="#8F8FFF">FAN-OUT &gt; FAN-IN · ITERATION CYCLE</text>
  <rect x="840" y="68" width="316" height="32" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>
  <text x="998" y="89" font-size="12" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">RETRY ≤ 2 · NEW JUDGE</text>

  <rect x="510" y="120" width="180" height="52" fill="#232329" stroke="#A5A3F5" stroke-width="1.2"/>
  <text x="600" y="142" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">QUESTION</text>
  <text x="600" y="160" font-size="11" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">study context</text>

  <text x="612" y="204" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">fan-out</text>
  <path d="M 600 172 L 230 232" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 600 172 L 600 232" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 600 172 L 970 232" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <rect x="140" y="236" width="180" height="56" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="230" y="270" font-size="13" font-weight="bold" fill="#101F1C" text-anchor="middle">RESEARCHER 1</text>
  <rect x="510" y="236" width="180" height="56" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="600" y="270" font-size="13" font-weight="bold" fill="#101F1C" text-anchor="middle">RESEARCHER 2</text>
  <rect x="880" y="236" width="180" height="56" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="970" y="270" font-size="13" font-weight="bold" fill="#101F1C" text-anchor="middle">RESEARCHER N</text>

  <path d="M 230 292 L 350 372" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 600 292 L 600 372" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 970 292 L 850 372" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <text x="612" y="344" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">fan-in</text>

  <rect x="140" y="376" width="920" height="74" fill="#232329" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="600" y="404" font-size="14" font-weight="bold" letter-spacing="1" fill="#2DD4BF" text-anchor="middle">LEDGER + CONFLICTS</text>
  <text x="600" y="428" font-size="12" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">excerpts · locators · ledger_version</text>

  <path d="M 600 450 L 600 480" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>

  <rect x="200" y="484" width="800" height="60" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <text x="600" y="510" font-size="13" font-weight="bold" letter-spacing="1" fill="#E4E4E7" text-anchor="middle">CRITIC PANEL 2–5</text>
  <text x="600" y="530" font-size="11" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">sees only ledger + conflicts + brief</text>

  <path d="M 600 544 L 600 576" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <text x="612" y="566" font-size="11" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">critiques</text>

  <!-- decision gate -->
  <path d="M 600 580 L 730 640 L 600 700 L 470 640 Z" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.5"/>
  <text x="600" y="637" font-size="14" font-weight="bold" letter-spacing="1" fill="#E4E4E7" text-anchor="middle">JUDGE</text>
  <text x="600" y="655" font-size="11" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">GATE</text>

  <!-- FAIL branch: loops up the right side and re-enters the ledger at its right edge -->
  <path d="M 730 640 L 1150 640 L 1150 413 L 1060 413" stroke="#8F8FFF" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrow-accent)" fill="none"/>
  <rect x="800" y="662" width="84" height="26" fill="none" stroke="#A5A3F5" stroke-width="1.2"/>
  <text x="842" y="680" font-size="12" font-weight="bold" fill="#A5A3F5" text-anchor="middle">FAIL</text>
  <text x="1128" y="530" font-size="12" font-weight="bold" fill="#A5A3F5" text-anchor="end">RETRY ≤ 2</text>
  <text x="1128" y="548" font-size="11" fill="#A5A3F5" text-anchor="end" font-family="Arial, Helvetica, sans-serif">upsert by id</text>

  <!-- PASS branch: goes straight down to the dossier -->
  <path d="M 600 700 L 600 764" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <rect x="614" y="719" width="84" height="26" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1"/>
  <text x="656" y="737" font-size="12" font-weight="bold" fill="#101F1C" text-anchor="middle">PASS</text>

  <rect x="460" y="770" width="280" height="52" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="600" y="792" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DOSSIER.MD</text>
  <text x="600" y="812" font-size="11" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">grouped by domain</text>
</svg>
