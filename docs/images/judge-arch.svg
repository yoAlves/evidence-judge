<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Judge: architecture — isolated critics, evidence, judge, and ledger</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9C5C0"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5A3F5"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="560" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>
  <text x="52" y="52" font-size="20" font-weight="bold" letter-spacing="1" fill="#8F8FFF">JUDGE · ARCHITECTURE</text>
  <rect x="800" y="68" width="356" height="32" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>
  <text x="978" y="89" font-size="13" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">BINARY GATE · PASS | FAIL</text>

  <rect x="52" y="120" width="320" height="180" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="68" y="148" font-size="15" font-weight="bold" letter-spacing="1" fill="#E4E4E7">CRITICS · PANEL 2–5</text>
  <rect x="68" y="164" width="90" height="40" fill="#2B2B33" stroke="#3F3F46" stroke-width="1"/>
  <text x="113" y="189" font-size="12" font-weight="bold" fill="#E4E4E7" text-anchor="middle">CRITIC 1</text>
  <rect x="166" y="164" width="90" height="40" fill="#2B2B33" stroke="#3F3F46" stroke-width="1"/>
  <text x="211" y="189" font-size="12" font-weight="bold" fill="#E4E4E7" text-anchor="middle">CRITIC 2</text>
  <rect x="68" y="212" width="90" height="40" fill="#2B2B33" stroke="#3F3F46" stroke-width="1"/>
  <text x="113" y="237" font-size="12" font-weight="bold" fill="#E4E4E7" text-anchor="middle">CRITIC 3</text>
  <rect x="166" y="212" width="90" height="40" fill="#2B2B33" stroke="#3F3F46" stroke-width="1"/>
  <text x="211" y="237" font-size="12" font-weight="bold" fill="#E4E4E7" text-anchor="middle">CRITIC 4</text>
  <circle cx="298" cy="232" r="9" fill="none" stroke="#A1A1AA" stroke-width="1.4"/>
  <line x1="291" y1="239" x2="305" y2="225" stroke="#A1A1AA" stroke-width="1.4"/>
  <text x="68" y="278" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">isolated: no cross-reading, no research/</text>

  <text x="52" y="352" font-size="12" font-weight="bold" letter-spacing="1" fill="#A1A1AA">EVIDENCE</text>
  <rect x="52" y="362" width="320" height="54" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="212" y="394" font-size="13" fill="#E4E4E7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">literal excerpt · source · locator</text>
  <rect x="52" y="428" width="320" height="54" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="212" y="460" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">score 0–5 · delivery contract</text>
  <text x="52" y="500" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">no re-findable locator, no inclusion</text>

  <rect x="440" y="210" width="330" height="240" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.5"/>
  <text x="605" y="250" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JUDGE</text>
  <text x="605" y="278" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">single content gate · verbatim transcription</text>
  <rect x="475" y="310" width="130" height="48" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="540" y="341" font-size="16" font-weight="bold" fill="#101F1C" text-anchor="middle">PASS</text>
  <rect x="625" y="310" width="130" height="48" fill="none" stroke="#A5A3F5" stroke-width="1.4"/>
  <text x="690" y="341" font-size="16" font-weight="bold" fill="#A5A3F5" text-anchor="middle">FAIL</text>
  <text x="605" y="404" font-size="12" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">condition = pending or retry</text>
  <text x="605" y="426" font-size="12" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">never "approved with conditions"</text>

  <rect x="880" y="150" width="268" height="300" fill="#232329" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="896" y="180" font-size="15" font-weight="bold" letter-spacing="1" fill="#2DD4BF">LEDGER</text>
  <text x="896" y="206" font-size="12" fill="#A1A1AA">id · quote · source · score</text>
  <line x1="896" y1="216" x2="1132" y2="216" stroke="#3F3F46" stroke-width="1"/>
  <text x="896" y="240" font-size="12" fill="#E4E4E7">D1 · verbatim quote · 5</text>
  <line x1="896" y1="252" x2="1132" y2="252" stroke="#3F3F46" stroke-width="1"/>
  <text x="896" y="276" font-size="12" fill="#E4E4E7">D2 · verbatim quote · 4</text>
  <line x1="896" y1="288" x2="1132" y2="288" stroke="#3F3F46" stroke-width="1"/>
  <text x="896" y="312" font-size="12" fill="#E4E4E7">D3 · pending · —</text>
  <line x1="896" y1="324" x2="1132" y2="324" stroke="#3F3F46" stroke-width="1"/>
  <text x="896" y="352" font-size="12" fill="#A1A1AA">critics: N · ledger_version</text>
  <text x="896" y="378" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">inference is never included</text>
  <text x="896" y="402" font-size="11" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">final_status: included | excluded | pending</text>

  <path d="M 372 215 L 434 255" stroke="#A5A3F5" stroke-width="1.4" marker-end="url(#arrow-accent)" fill="none"/>
  <text x="378" y="201" font-size="12" font-weight="bold" fill="#A5A3F5">critiques</text>
  <path d="M 372 389 L 434 350" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 372 455 L 434 415" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <path d="M 770 285 L 874 285" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#arrow)" fill="none"/>
  <text x="776" y="273" font-size="12" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">decisions</text>

  <text x="1148" y="544" font-size="15" fill="#E4E4E7" text-anchor="end" font-family="Arial, Helvetica, sans-serif">no excerpt, no claim</text>
  <text x="1148" y="570" font-size="13" fill="#A1A1AA" text-anchor="end" font-family="Arial, Helvetica, sans-serif">whatever fails the gate becomes pending or excluded · temporary scratchpad, nothing in the project</text>
</svg>
