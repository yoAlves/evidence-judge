<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Judge: the judge in court — a binary PASS/FAIL gate over evidence</title>

  <rect x="20" y="20" width="1160" height="510" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>

  <!-- wooden wall panels -->
  <g fill="#232329" stroke="#3F3F46" stroke-width="0.8">
    <rect x="40" y="24" width="112" height="316"/>
    <rect x="160" y="24" width="112" height="316"/>
    <rect x="280" y="24" width="112" height="316"/>
    <rect x="400" y="24" width="112" height="316"/>
    <rect x="520" y="24" width="112" height="316"/>
    <rect x="640" y="24" width="112" height="316"/>
    <rect x="760" y="24" width="112" height="316"/>
    <rect x="880" y="24" width="112" height="316"/>
    <rect x="1000" y="24" width="112" height="316"/>
  </g>

  <!-- arch behind the judge -->
  <rect x="480" y="50" width="240" height="290" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <path d="M 530 340 L 530 160 Q 600 110 670 160 L 670 340 Z" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>

  <!-- floor -->
  <rect x="40" y="340" width="1120" height="170" fill="#1A1A1F"/>
  <line x1="40" y1="340" x2="1160" y2="340" stroke="#3F3F46" stroke-width="1.5"/>
  <g fill="#232329">
    <rect x="128" y="468" width="24" height="24" transform="rotate(45 140 480)"/>
    <rect x="268" y="428" width="24" height="24" transform="rotate(45 280 440)"/>
    <rect x="378" y="466" width="24" height="24" transform="rotate(45 390 478)"/>
    <rect x="818" y="466" width="24" height="24" transform="rotate(45 830 478)"/>
    <rect x="948" y="428" width="24" height="24" transform="rotate(45 960 440)"/>
    <rect x="1088" y="468" width="24" height="24" transform="rotate(45 1100 480)"/>
  </g>

  <!-- left gallery: back row -->
  <circle cx="130" cy="352" r="12" fill="#3F3F46"/>
  <circle cx="200" cy="352" r="12" fill="#3F3F46"/>
  <circle cx="270" cy="352" r="12" fill="#3F3F46"/>
  <rect x="110" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="180" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="250" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="80" y="376" width="240" height="40" fill="#232329" stroke="#3F3F46" stroke-width="1.2"/>
  <!-- left gallery: front row -->
  <circle cx="110" cy="414" r="13" fill="#3F3F46"/>
  <circle cx="190" cy="414" r="13" fill="#3F3F46"/>
  <circle cx="270" cy="414" r="13" fill="#3F3F46"/>
  <rect x="90" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="170" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="250" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="60" y="440" width="280" height="48" fill="#232329" stroke="#3F3F46" stroke-width="1.2"/>

  <!-- right gallery: back row -->
  <circle cx="930" cy="352" r="12" fill="#3F3F46"/>
  <circle cx="1000" cy="352" r="12" fill="#3F3F46"/>
  <circle cx="1070" cy="352" r="12" fill="#3F3F46"/>
  <rect x="910" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="980" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="1050" y="364" width="40" height="22" rx="6" fill="#2B2B33"/>
  <rect x="880" y="376" width="240" height="40" fill="#232329" stroke="#3F3F46" stroke-width="1.2"/>
  <!-- right gallery: front row -->
  <circle cx="910" cy="414" r="13" fill="#3F3F46"/>
  <circle cx="990" cy="414" r="13" fill="#3F3F46"/>
  <circle cx="1070" cy="414" r="13" fill="#3F3F46"/>
  <rect x="890" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="970" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="1050" y="426" width="42" height="24" rx="6" fill="#2B2B33"/>
  <rect x="860" y="440" width="280" height="48" fill="#232329" stroke="#3F3F46" stroke-width="1.2"/>

  <!-- scales of justice (left) -->
  <rect x="397" y="343" width="6" height="149" fill="#A5A3F5"/>
  <rect x="382" y="492" width="36" height="10" fill="#232329" stroke="#A5A3F5" stroke-width="1"/>
  <rect x="350" y="336" width="100" height="7" rx="3" fill="#A5A3F5"/>
  <path d="M 352 343 L 344 372 M 352 343 L 360 372" stroke="#A5A3F5" stroke-width="1.2" fill="none"/>
  <path d="M 336 372 Q 352 388 368 372 Z" fill="#A5A3F5" opacity="0.35" stroke="#A5A3F5" stroke-width="1.2"/>
  <path d="M 448 343 L 440 372 M 448 343 L 456 372" stroke="#A5A3F5" stroke-width="1.2" fill="none"/>
  <path d="M 432 372 Q 448 388 464 372 Z" fill="#A5A3F5" opacity="0.35" stroke="#A5A3F5" stroke-width="1.2"/>

  <!-- scales of justice (right) -->
  <rect x="797" y="343" width="6" height="149" fill="#A5A3F5"/>
  <rect x="782" y="492" width="36" height="10" fill="#232329" stroke="#A5A3F5" stroke-width="1"/>
  <rect x="750" y="336" width="100" height="7" rx="3" fill="#A5A3F5"/>
  <path d="M 752 343 L 744 372 M 752 343 L 760 372" stroke="#A5A3F5" stroke-width="1.2" fill="none"/>
  <path d="M 736 372 Q 752 388 768 372 Z" fill="#A5A3F5" opacity="0.35" stroke="#A5A3F5" stroke-width="1.2"/>
  <path d="M 848 343 L 840 372 M 848 343 L 856 372" stroke="#A5A3F5" stroke-width="1.2" fill="none"/>
  <path d="M 832 372 Q 848 388 864 372 Z" fill="#A5A3F5" opacity="0.35" stroke="#A5A3F5" stroke-width="1.2"/>

  <!-- shadow under the bench -->
  <ellipse cx="600" cy="506" rx="175" ry="9" fill="#0E0E10"/>

  <!-- judge -->
  <path d="M 505 410 Q 505 270 560 246 L 640 246 Q 695 270 695 410 Z" fill="#141417" stroke="#C9C5C0" stroke-width="1.5"/>
  <!-- resting arm -->
  <path d="M 532 280 Q 518 312 530 342" stroke="#C9C5C0" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M 532 280 Q 518 312 530 342" stroke="#141417" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- raised arm with gavel -->
  <path d="M 670 274 Q 702 266 716 238" stroke="#C9C5C0" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M 670 274 Q 702 266 716 238" stroke="#141417" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- head -->
  <circle cx="600" cy="146" r="14" fill="#5D4037"/>
  <circle cx="600" cy="202" r="38" fill="#E8B48B"/>
  <path d="M 562 202 A 38 38 0 0 1 638 202 L 638 194 Q 636 160 600 158 Q 564 160 562 194 Z" fill="#5D4037"/>
  <path d="M 562 198 Q 558 222 566 236 L 572 232 Q 564 218 566 198 Z" fill="#5D4037"/>
  <path d="M 638 198 Q 642 222 634 236 L 628 232 Q 636 218 634 198 Z" fill="#5D4037"/>
  <circle cx="587" cy="206" r="3.5" fill="#2B2B33"/>
  <circle cx="613" cy="206" r="3.5" fill="#2B2B33"/>
  <path d="M 591 224 Q 600 231 609 224" stroke="#8D5B3F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- collar -->
  <path d="M 586 262 Q 600 254 614 262 L 607 286 Q 600 291 593 286 Z" fill="#FFFFFF"/>
  <!-- gavel -->
  <circle cx="718" cy="232" r="9" fill="#E8B48B"/>
  <path d="M 714 234 L 744 200" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/>
  <rect x="731" y="182" width="34" height="20" rx="5" fill="#6D4C41" stroke="#C9C5C0" stroke-width="1" transform="rotate(45 748 192)"/>
  <path d="M 774 172 L 784 162 M 780 184 L 792 176" stroke="#3F3F46" stroke-width="1.5" stroke-linecap="round"/>

  <!-- bench -->
  <rect x="460" y="370" width="280" height="130" fill="#232329" stroke="#C9C5C0" stroke-width="1.5"/>
  <rect x="440" y="350" width="320" height="26" fill="#2B2B33" stroke="#C9C5C0" stroke-width="1.5"/>
  <!-- documents on the bench -->
  <rect x="458" y="342" width="64" height="8" fill="#E4E4E7" stroke="#C9C5C0" stroke-width="0.8"/>
  <rect x="462" y="334" width="60" height="8" fill="#E4E4E7" stroke="#C9C5C0" stroke-width="0.8"/>
  <!-- hand resting on the bench -->
  <circle cx="536" cy="352" r="8" fill="#E8B48B"/>
  <!-- gate stamps -->
  <rect x="500" y="420" width="88" height="34" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="544" y="443" font-size="14" font-weight="bold" fill="#101F1C" text-anchor="middle">PASS</text>
  <rect x="612" y="420" width="88" height="34" fill="none" stroke="#A5A3F5" stroke-width="1.4"/>
  <text x="656" y="443" font-size="14" font-weight="bold" fill="#A5A3F5" text-anchor="middle">FAIL</text>
</svg>
